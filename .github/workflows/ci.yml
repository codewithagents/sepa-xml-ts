name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal permissions. Fork PRs have no secrets access by design with pull_request trigger.
permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      # The XSD-oracle and round-trip property suites are the gate: green means every
      # generated file validates against the official EPC schema and parses back exactly.
      - run: pnpm test
      - run: pnpm test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
