name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Re-publish sepa-xml-ts (for failed release recovery)'
        type: boolean
        default: false

permissions:
  contents: write # create tags and releases
  pull-requests: write # create and update release PRs

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.release.outputs['.--version'] }}
    steps:
      # Manifest mode: .release-please-manifest.json tracks the current version and
      # release-please-config.json keeps us pre-1.0 (minor bumps on feat, patch on
      # fix) instead of jumping to 1.0.0. Single package keyed at the repo root ".".
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish sepa-xml-ts to npm
    needs: release-please
    # Compare to the string 'true' explicitly: release-please emits the literal
    # string "false" when nothing is released, and any non-empty string is truthy
    # in a GitHub Actions if(), which would otherwise run publish on every push.
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.publish }}
    runs-on: ubuntu-latest
    # The 'release' environment requires a manual approval (reviewer) before this
    # privileged job runs. Even a tampered push to main cannot auto-publish to npm:
    # the OIDC token exchange only happens after a human approves the deployment.
    environment: release
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Node 22 ships npm 10.x, which does not implement OIDC Trusted Publishing.
      # OIDC auth requires npm 11.5.1+, so pin a known-good version before publishing.
      # Pinned (not @latest) so a compromised npm release cannot run unreviewed code
      # in this privileged id-token: write job. Bump deliberately via PR.
      - name: Upgrade npm to pinned version (OIDC Trusted Publishing requires >=11.5.1)
        run: npm install -g npm@11.5.1
      # setup-node injects NODE_AUTH_TOKEN into .npmrc, which blocks OIDC.
      # Remove it so npm falls back to the OIDC token exchange.
      - name: Remove injected auth token (npm will use OIDC Trusted Publishing)
        run: npm config delete //registry.npmjs.org/:_authToken
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # --provenance adds supply-chain attestation and triggers the OIDC exchange.
      # Use npm (not pnpm): only the npm CLI implements Trusted Publishing.
      - run: npm publish --access public --provenance
