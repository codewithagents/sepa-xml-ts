name: Fallow (Code Quality)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # required for inline review comments

jobs:
  fallow:
    name: Code Intelligence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history needed for audit base comparison
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: fallow-rs/fallow@d052786ef2baf78fa5b196f06dbccd6f0d26798e # v3
        env:
          # fallow-rs/fallow nests JavaScript actions (cache, codeql-action) that may pin Node.js 20.
          # GitHub is moving action runners to Node.js 24, so opt in early to catch breakage.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          command: audit
          comment: true # sticky PR summary comment
          review-comments: true # inline suggestions on changed lines
          annotations: true # diff annotations in the Files tab
          fail-on-issues: false # advisory only, never blocks merge
